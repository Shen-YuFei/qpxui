name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        # The Azure Ubuntu mirror sometimes stalls on large packages
        # (libwebkit2gtk); fail fast on a stalled download and retry.
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          PKGS="libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev patchelf"
          # Only the download is time-limited: killing dpkg mid-install would break the retries.
          for i in 1 2 3; do
            sudo apt-get $APT update &&
            timeout 300 sudo apt-get $APT install -y --download-only --no-install-recommends $PKGS && break
            [ "$i" = 3 ] && exit 1
            echo "apt attempt $i failed, retrying"; sleep 15
          done
          sudo apt-get $APT install -y --no-install-recommends $PKGS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # tauri::generate_context! needs the frontend dist folder to exist.
      - run: mkdir -p dist
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      # Tests that need the live quantms portal are #[ignore]d; run them
      # locally with `cargo test -- --ignored`.
      - run: cargo test --locked
        working-directory: src-tauri

  # The installers for every platform, as the release builds them, kept as
  # workflow artifacts so a change is known to build and run on macOS and
  # Windows before it is released.
  bundle:
    name: bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: windows
            platform: windows-latest
            args: ""
            rust_targets: ""
          # Both macOS builds run on Apple Silicon runners; the Intel build cross-compiles.
          - name: macos-arm64
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - name: macos-x64
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          PKGS="libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev patchelf"
          for i in 1 2 3; do
            sudo apt-get $APT update &&
            timeout 300 sudo apt-get $APT install -y --download-only --no-install-recommends $PKGS && break
            [ "$i" = 3 ] && exit 1
            echo "apt attempt $i failed, retrying"; sleep 15
          done
          sudo apt-get $APT install -y --no-install-recommends $PKGS
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust_targets }}
      - run: npm ci
      - run: npm run tauri build -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: qpxui-${{ matrix.name }}
          path: src-tauri/target/**/release/bundle/
          if-no-files-found: error
